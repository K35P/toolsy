name: Tauri build and tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            nasm \
            patchelf

      - name: Install macOS AVIF assembly tools
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install dav1d build tools
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dav1d build tools
        if: runner.os != 'Windows'
        run: python -m pip install meson ninja

      - name: Configure internal dav1d build
        if: runner.os != 'Windows'
        run: echo SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always >> "$GITHUB_ENV"

      - name: Install Windows AVIF decoder dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          vcpkg install dav1d:x64-windows
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust commands and image encoding
        run: pnpm test

      - name: Build Tauri frontend
        run: pnpm build:web

      - name: Build desktop bundles
        run: pnpm tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: toolsy-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

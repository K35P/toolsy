name: Tauri build and tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            nasm \
            patchelf

      - name: Install macOS AVIF assembly tools
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install dav1d build tools
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        if: runner.os != 'Windows'
        run: python -m pip install meson ninja

      # Unix: build dav1d from source and link statically.
      - name: Configure internal dav1d build
        if: runner.os != 'Windows'
        run: echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"

      # Windows: use MSVC-compatible dav1d from vcpkg and put its DLL on PATH
      # so tests/binaries can load it (STATUS_DLL_NOT_FOUND without this).
      # Do NOT use SYSTEM_DEPS_DAV1D_BUILD_INTERNAL here: dav1d-sys' internal
      # Meson build produces MinGW objects that fail to link with link.exe.
      - name: Install Windows AVIF decoder dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          vcpkg install dav1d:x64-windows
          $root = $env:VCPKG_INSTALLATION_ROOT
          $pkgConfig = Join-Path $root "installed\x64-windows\lib\pkgconfig"
          $bin = Join-Path $root "installed\x64-windows\bin"
          "PKG_CONFIG_PATH=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $bin -Filter "dav1d*.dll" | ForEach-Object { Write-Host "Found $($_.FullName)" }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust commands and image encoding
        run: pnpm test

      - name: Build Tauri frontend
        run: pnpm build:web

      - name: Build desktop bundles
        run: pnpm tauri:build

      # Keep dav1d.dll next to the Windows executable for the uploaded artifact.
      - name: Bundle Windows dav1d runtime DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin\dav1d.dll"
          $targets = @(
            "src-tauri\target\release",
            "src-tauri\target\release\bundle\msi",
            "src-tauri\target\release\bundle\nsis"
          ) | Where-Object { Test-Path $_ }
          foreach ($dir in $targets) {
            Copy-Item -Force $dll (Join-Path $dir "dav1d.dll")
            Write-Host "Copied dav1d.dll -> $dir"
          }

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: toolsy-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  # On every push to main, refresh a single public pre-release so users can
  # download installers from https://github.com/K35P/toolsy/releases
  publish-continuous-release:
    name: Publish continuous release
    needs: desktop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: toolsy-*
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            case "$file" in
              *.dmg|*.zip|*.msi|*.exe|*.deb|*.AppImage|*.rpm|*.dll) ;;
              *) continue ;;
            esac
            relative="${file#artifacts/}"
            platform="${relative%%/*}"
            base="$(basename "$file")"
            dest="release-assets/${platform}-${base}"
            cp "$file" "$dest"
            echo "Prepared $dest"
          done < <(find artifacts -type f -print0)
          echo "---- release-assets ----"
          ls -lah release-assets
          test "$(find release-assets -type f | wc -l)" -gt 0

      - name: Publish / update continuous pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: continuous
          commit: ${{ github.sha }}
          name: Continuous build
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          artifactErrorsFailBuild: true
          artifacts: release-assets/*
          body: |
            Automatic build from `main`.

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Workflow | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            This pre-release is **replaced on every push to `main`**. Prefer versioned tags (e.g. `v1.0.0`) for stable downloads once you start cutting formal releases.

            Builds are not code-signed yet; macOS Gatekeeper / Windows SmartScreen may warn on first open.
          token: ${{ secrets.GITHUB_TOKEN }}
